[project]
name = "balatro-agent"
version = "0.1.0"
description = "Autonomous LLM Agent for Balatro Mobile & Desktop via JSON-RPC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "openai>=1.25.0",
    "anthropic>=0.25.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
]

[project.scripts]
balatro-agent = "src.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
